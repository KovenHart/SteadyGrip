<!doctype html>
<html lang="fr" data-theme="classic">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SteadyGrip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;family=Barlow:wght@400;500;600;700&amp;family=Barlow+Condensed:wght@300;400&amp;display=swap" rel="stylesheet">
<link rel="icon" href="icone.svg">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="topbar">
  <button type="button" class="brand" data-action="home" aria-label="Retour à mes jeux">
    <svg class="logo" width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><rect x="0.5" y="0.5" width="31" height="31" rx="7" fill="#141414" stroke="var(--border)"/><circle cx="16" cy="16" r="9.5" fill="none" stroke="#f2f2f2" stroke-width="2.4"/><path d="M16 2.5v4M16 25.5v4M2.5 16h4M25.5 16h4" stroke="#f2f2f2" stroke-width="2.4" stroke-linecap="round"/><path d="M9.5 16 L11 13.6 L12.8 18.4 L14.6 16" fill="none" stroke="#8a8a8a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M16 16 H23.5" stroke="var(--accent-line)" stroke-width="2.2" stroke-linecap="round"/><circle cx="16" cy="16" r="2.4" fill="var(--accent-line)"/></svg>
    <span>SteadyGrip</span>
  </button>
  <div id="ready" class="ready" role="status" aria-live="polite"></div>
  <button type="button" class="btn ghost" data-action="settings">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
    Paramètres
  </button>
</header>
<div id="checks" class="checks"></div>
<main id="view"></main>
<div id="modal" class="modal-backdrop" hidden></div>
<script src="app.js"></script>
</body>
</html>
